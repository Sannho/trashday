name: Build

# Runs only when a release is published (the exe is attached to it),
# or by hand from the Actions tab (the exe is kept as a run artifact).
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write # needed to attach files to the release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Test and build
        run: ./build.ps1

      - name: Checksum
        run: (Get-FileHash trashday.exe -Algorithm SHA256).Hash.ToLower() + "  trashday.exe" | Out-File -Encoding ascii trashday.exe.sha256

      - uses: actions/upload-artifact@v7
        with:
          name: trashday
          path: |
            trashday.exe
            trashday.exe.sha256

      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" trashday.exe trashday.exe.sha256 --clobber
