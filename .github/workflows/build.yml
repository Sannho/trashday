name: Build

# Every push and pull request: test and build on GitHub's Windows runner.
# Pushing a tag like v1.0.0 also publishes a GitHub release with trashday.exe.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed to create the release on tags

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Test and build
        run: ./build.ps1

      - name: Checksum
        run: (Get-FileHash trashday.exe -Algorithm SHA256).Hash.ToLower() + "  trashday.exe" | Out-File -Encoding ascii trashday.exe.sha256

      - uses: actions/upload-artifact@v5
        with:
          name: trashday
          path: |
            trashday.exe
            trashday.exe.sha256

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" trashday.exe trashday.exe.sha256 --title "TrashDay ${{ github.ref_name }}" --generate-notes
