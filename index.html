<!doctype html>
<html lang="en" class="h-full [color-scheme:light_dark]">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TrashDay</title>
<!-- Replaced by the inlined, generated CSS at build time (see main.go). -->
<link rel="stylesheet" href="ui.css">
</head>
<body class="flex h-full select-none flex-col bg-slate-100 text-sm text-slate-800 dark:bg-slate-950 dark:text-slate-100" style="font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif">
<header class="flex items-center gap-3 px-5 pt-5 pb-3">
  <svg viewBox="0 0 64 64" class="size-10 shrink-0" aria-hidden="true">
    <rect x="11" y="12" width="36" height="6" rx="1.5" fill="#2f6be0"/>
    <rect x="23" y="7" width="12" height="7" rx="1.5" fill="none" stroke="#2f6be0" stroke-width="2.5"/>
    <path d="M14 20h30l-3 36H17z" fill="#3d8bfd"/>
    <path d="M22 26v24M29 26v24M36 26v24" stroke="#a8d0ff" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M52 8q1 7 8 8-7 1-8 8-1-7-8-8 7-1 8-8z" fill="#ffc82e"/>
  </svg>
  <div>
    <h1 class="text-xl font-semibold">TrashDay</h1>
    <p data-i18n="hint" class="text-xs text-slate-500 dark:text-slate-400"></p>
  </div>
</header>

<main id="list" class="min-h-0 flex-1 space-y-3 overflow-y-auto px-5 pt-1 pb-3"></main>

<footer class="border-t border-slate-200 bg-white px-5 pt-4 pb-5 dark:border-slate-800 dark:bg-slate-900">
  <div class="flex items-center gap-3">
    <label class="flex flex-1 cursor-pointer items-center gap-2">
      <input type="checkbox" id="all" class="size-4 cursor-pointer accent-blue-600">
      <span data-i18n="selectAll"></span>
    </label>
    <div class="relative flex">
      <button id="run" disabled class="cursor-pointer rounded-l-lg bg-blue-600 px-4 py-2 font-semibold text-white transition hover:bg-blue-700 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600 disabled:cursor-default disabled:opacity-50 disabled:hover:bg-blue-600"></button>
      <button id="modeBtn" aria-haspopup="menu" aria-expanded="false" class="cursor-pointer rounded-r-lg border-l border-blue-500 bg-blue-600 px-2 text-white transition hover:bg-blue-700 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600 disabled:cursor-default disabled:opacity-50 disabled:hover:bg-blue-600">
        <svg viewBox="0 0 20 20" class="size-4" fill="currentColor" aria-hidden="true"><path d="M5.2 7.2a.75.75 0 0 1 1.06 0L10 10.94l3.74-3.74a.75.75 0 1 1 1.06 1.06l-4.27 4.27a.75.75 0 0 1-1.06 0L5.2 8.26a.75.75 0 0 1 0-1.06z"/></svg>
      </button>
      <div id="menu" role="menu" hidden class="absolute right-0 bottom-full mb-2 w-64 overflow-hidden rounded-xl border border-slate-200 bg-white py-1 shadow-lg dark:border-slate-700 dark:bg-slate-800">
        <button role="menuitemradio" data-mode="clean" class="block w-full cursor-pointer px-3.5 py-2 text-left hover:bg-blue-50 focus-visible:bg-blue-50 focus-visible:outline-none aria-checked:font-semibold aria-checked:text-blue-600 dark:hover:bg-blue-500/10 dark:focus-visible:bg-blue-500/10 dark:aria-checked:text-blue-400"><span data-i18n="clean"></span><span data-i18n="cleanDesc" class="block text-xs font-normal text-slate-500 dark:text-slate-400"></span></button>
        <button role="menuitemradio" data-mode="scan" class="block w-full cursor-pointer px-3.5 py-2 text-left hover:bg-blue-50 focus-visible:bg-blue-50 focus-visible:outline-none aria-checked:font-semibold aria-checked:text-blue-600 dark:hover:bg-blue-500/10 dark:focus-visible:bg-blue-500/10 dark:aria-checked:text-blue-400"><span data-i18n="scan"></span><span data-i18n="scanDesc" class="block text-xs font-normal text-slate-500 dark:text-slate-400"></span></button>
        <button role="menuitemradio" data-mode="quick" class="block w-full cursor-pointer px-3.5 py-2 text-left hover:bg-blue-50 focus-visible:bg-blue-50 focus-visible:outline-none aria-checked:font-semibold aria-checked:text-blue-600 dark:hover:bg-blue-500/10 dark:focus-visible:bg-blue-500/10 dark:aria-checked:text-blue-400"><span data-i18n="quick"></span><span data-i18n="quickDesc" class="block text-xs font-normal text-slate-500 dark:text-slate-400"></span></button>
      </div>
    </div>
  </div>
  <div class="mt-4 h-1 overflow-hidden rounded-full bg-slate-200 dark:bg-slate-800">
    <div id="bar" class="h-full w-0 bg-blue-600 transition-all duration-200"></div>
  </div>
  <div id="result" role="status" class="mt-2.5 min-h-5 text-[13px] text-slate-500 dark:text-slate-400"></div>
</footer>

<template id="section">
  <section class="overflow-hidden rounded-xl border border-slate-200 bg-white dark:border-slate-800 dark:bg-slate-900">
    <h2 class="flex items-center justify-between px-3.5 pt-2.5 pb-1.5 text-xs font-semibold tracking-wide text-slate-500 uppercase dark:text-slate-400">
      <span></span>
      <button data-i18n="all" class="cursor-pointer rounded font-medium tracking-normal text-blue-600 normal-case hover:underline focus-visible:outline-2 focus-visible:outline-blue-600 dark:text-blue-400"></button>
    </h2>
  </section>
</template>

<template id="row">
  <label class="flex cursor-pointer items-center gap-2.5 border-t border-slate-100 px-3.5 py-2 first-of-type:border-t-0 hover:bg-blue-50 dark:border-slate-800 dark:hover:bg-blue-500/10">
    <input type="checkbox" class="size-4 shrink-0 cursor-pointer accent-blue-600 disabled:cursor-default">
    <span class="min-w-0 flex-1">
      <span data-role="name" class="block"></span>
      <span data-role="desc" class="block truncate text-xs text-slate-500 dark:text-slate-400"></span>
    </span>
    <span data-role="status" class="shrink-0 text-xs text-slate-500 tabular-nums dark:text-slate-400"></span>
  </label>
</template>

<script>
  const $ = (s) => document.querySelector(s);
  const STATUS = "shrink-0 text-xs tabular-nums ";
  const OK = STATUS + "text-emerald-600 dark:text-emerald-400";
  const WARN = STATUS + "text-amber-600 dark:text-amber-400";
  const IDLE = STATUS + "text-slate-500 dark:text-slate-400";
  const SPINNER = '<span class="inline-block size-3.5 animate-spin rounded-full border-2 border-slate-200 border-t-blue-600 align-middle dark:border-slate-700 dark:border-t-blue-400"></span>';

  // UI language follows the system (WebView2 reports the Windows display language).
  const lang = navigator.language.toLowerCase().startsWith("fr") ? "fr" : "en";
  const T = {
    fr: {
      hint: "Fermez les navigateurs avant de vider leurs caches.", selectAll: "Tout sélectionner", all: "Tout",
      menu: "Changer d'action",
      clean: "Nettoyer", cleanDesc: "Supprime les éléments cochés",
      scan: "Analyser", scanDesc: "Mesure sans rien supprimer",
      quick: "Nettoyage rapide", quickDesc: "Fichiers temporaires et rapports d'erreurs",
      scanning: "Analyse en cours…", cleaning: "Nettoyage en cours…",
      freed: (s) => `✓ ${s} libérés`, found: (s) => `${s} récupérables`,
      skipped: (n) => `${n} ignoré(s)`, skippedTitle: "Fichiers en cours d'utilisation, non supprimés.",
      lockedTotal: (n) => ` — ${n} élément(s) en cours d'utilisation ignoré(s).`,
      unreadable: (n) => ` — ${n} élément(s) illisible(s).`,
      units: ["o", "Ko", "Mo", "Go", "To"],
    },
    en: {
      hint: "Close your browsers before clearing their caches.", selectAll: "Select all", all: "All",
      menu: "Change action",
      clean: "Clean", cleanDesc: "Deletes the checked items",
      scan: "Analyze", scanDesc: "Measures without deleting anything",
      quick: "Quick clean", quickDesc: "Temporary files and error reports",
      scanning: "Analyzing…", cleaning: "Cleaning…",
      freed: (s) => `✓ ${s} freed`, found: (s) => `${s} can be freed`,
      skipped: (n) => `${n} skipped`, skippedTitle: "Files in use, not deleted.",
      lockedTotal: (n) => ` — ${n} item(s) in use skipped.`,
      unreadable: (n) => ` — ${n} item(s) unreadable.`,
      units: ["B", "KB", "MB", "GB", "TB"],
    },
  }[lang];

  const num = new Intl.NumberFormat(lang, { maximumFractionDigits: 1 });
  function size(bytes) {
    let i = 0;
    while (bytes >= 1024 && i < T.units.length - 1) { bytes /= 1024; i++; }
    return `${num.format(i ? bytes : Math.round(bytes))} ${T.units[i]}`;
  }

  let boxes = [], statuses = [], quick = [], running = false, runMode = "", done = 0, todo = 0;

  // Selection and action are remembered between launches (per-viewer convenience only).
  const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } };
  const store = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
  let mode = ["clean", "scan", "quick"].includes(load("trashday.mode")) ? load("trashday.mode") : "clean";

  // In quick mode the boxes show the fixed quick set; the user's own selection stays in storage.
  function refresh() {
    if (mode === "quick") boxes.forEach((b, i) => b.checked = quick[i]);
    boxes.forEach(b => b.disabled = running || mode === "quick");
    if (mode !== "quick") store("trashday.sel", boxes.filter(b => b.checked).map(b => b.dataset.key));
    const n = boxes.filter(b => b.checked).length;
    $("#all").checked = n === boxes.length;
    $("#all").indeterminate = n > 0 && n < boxes.length;
    $("#all").disabled = running || mode === "quick";
    $("#run").disabled = running || n === 0;
    $("#modeBtn").disabled = running;
    $("#run").textContent = mode !== "quick" && n ? `${T[mode]} (${n})` : T[mode];
    document.querySelectorAll("#menu [data-mode]").forEach(m => m.setAttribute("aria-checked", m.dataset.mode === mode));
  }

  function setMode(m) {
    if (mode === "quick" && m !== "quick") {
      const sel = load("trashday.sel", []);
      boxes.forEach(b => b.checked = sel.includes(b.dataset.key));
    }
    mode = m;
    store("trashday.mode", m);
    refresh();
  }

  function toggleMenu(open) {
    $("#menu").hidden = !open;
    $("#modeBtn").setAttribute("aria-expanded", open);
    if (open) $(`#menu [data-mode="${mode}"]`).focus();
  }

  function setChecked(list, on) { list.forEach(b => b.checked = on); refresh(); }

  // Fills every [data-i18n] element under root.
  function translate(root) { root.querySelectorAll("[data-i18n]").forEach(el => el.textContent = T[el.dataset.i18n]); }

  async function init() {
    document.documentElement.lang = lang;
    translate(document);
    $("#modeBtn").setAttribute("aria-label", T.menu);
    const targets = await goTargets(lang);
    const sel = load("trashday.sel", []);
    const groups = new Map();
    targets.forEach((t, id) => {
      if (!groups.has(t.group)) {
        const sec = $("#section").content.firstElementChild.cloneNode(true);
        translate(sec);
        sec.querySelector("span").textContent = t.group;
        $("#list").append(sec);
        const g = { sec, boxes: [] };
        sec.querySelector("button").onclick = () => { if (!running) setChecked(g.boxes, !g.boxes.every(b => b.checked)); };
        groups.set(t.group, g);
      }
      const g = groups.get(t.group);
      const row = $("#row").content.firstElementChild.cloneNode(true);
      const box = row.querySelector("input");
      box.dataset.key = t.key;
      box.checked = sel.includes(t.key);
      box.onchange = refresh;
      row.querySelector("[data-role=name]").textContent = t.name;
      const desc = row.querySelector("[data-role=desc]");
      if (t.desc) { desc.textContent = desc.title = t.desc; } else desc.remove();
      quick[id] = t.quick;
      g.sec.append(row);
      g.boxes.push(box);
      boxes[id] = box;
      statuses[id] = row.querySelector("[data-role=status]");
    });
    $("#all").onchange = (e) => setChecked(boxes, e.target.checked);
    $("#run").onclick = start;
    $("#modeBtn").onclick = (e) => { e.stopPropagation(); toggleMenu($("#menu").hidden); };
    document.querySelectorAll("#menu [data-mode]").forEach(m => m.onclick = () => { setMode(m.dataset.mode); toggleMenu(false); $("#run").focus(); });
    document.addEventListener("click", (e) => { if (!$("#menu").contains(e.target)) toggleMenu(false); });
    document.addEventListener("keydown", (e) => {
      if ($("#menu").hidden) return;
      const items = [...document.querySelectorAll("#menu [data-mode]")];
      const i = items.indexOf(document.activeElement);
      if (e.key === "Escape") { toggleMenu(false); $("#modeBtn").focus(); }
      if (e.key === "ArrowDown") { e.preventDefault(); items[(i + 1) % items.length].focus(); }
      if (e.key === "ArrowUp") { e.preventDefault(); items[(i + items.length - 1) % items.length].focus(); }
    });
    setMode(mode);
  }

  function start() {
    const ids = boxes.map((b, i) => b.checked ? i : -1).filter(i => i >= 0);
    running = true; runMode = mode; done = 0; todo = ids.length;
    statuses.forEach(s => { s.textContent = ""; s.className = IDLE; s.title = ""; });
    $("#bar").style.width = "0";
    $("#result").textContent = mode === "scan" ? T.scanning : T.cleaning;
    refresh();
    goClean(ids, mode === "scan");
  }

  // Called from Go: res is null when the target starts, then {freed (bytes), failed}.
  function onProgress(id, res) {
    const s = statuses[id];
    if (!res) { s.innerHTML = SPINNER; return; }
    s.textContent = res.failed ? `${size(res.freed)} · ${T.skipped(res.failed)}` : size(res.freed);
    s.className = res.failed ? WARN : runMode === "scan" ? IDLE : OK;
    s.title = res.failed ? T.skippedTitle : "";
    $("#bar").style.width = `${++done / todo * 100}%`;
  }

  function onDone(total) {
    running = false;
    const r = $("#result");
    r.textContent = "";
    const b = document.createElement("b");
    b.className = "font-semibold text-emerald-600 dark:text-emerald-400";
    b.textContent = runMode === "scan" ? T.found(size(total.freed)) : T.freed(size(total.freed));
    r.append(b);
    if (total.failed) r.append(runMode === "scan" ? T.unreadable(total.failed) : T.lockedTotal(total.failed));
    refresh();
  }

  window.addEventListener("DOMContentLoaded", init);
</script>
</body>
</html>
